name: ci

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: yuancheng_test
          POSTGRES_USER: yuancheng_app
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yuancheng_app -d yuancheng_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 10000
      DATABASE_URL: postgresql://yuancheng_app:test-password@127.0.0.1:5432/yuancheng_test
      ADMIN_WEB_ORIGIN: http://localhost:5173
      SESSION_SECRET: 0123456789abcdef0123456789abcdef
      PUBLIC_SERVER_URL: http://localhost:10000
      DEPLOYMENT_MODE: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm db:rollback

  windows-agent:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Yuancheng.slnx --locked-mode
      - run: dotnet run --project tests/Agent.Core.Tests/Agent.Core.Tests.csproj --no-restore
      - run: dotnet build apps/agent-windows/src/Yuancheng.Agent/Yuancheng.Agent.csproj --configuration Test --no-restore
      - run: dotnet build apps/agent-windows/src/Yuancheng.Agent/Yuancheng.Agent.csproj --configuration Production --no-restore
